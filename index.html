<html lang="ar" dir="rtl">
<head>

<title>إدارة العقارات</title>

<style>
:root{

  --page:#f3f3f3; --card:#fff; --line:#e5e5e5; --line2:#dddbda; --row-hover:#f3f2f2; --th-bg:#fafaf9;
  --ink:#080707; --ink2:#3e3e3c; --muted:#706e6b;
  --green:#2e844a; --green-bg:#eafbec; --amber:#a86403; --amber-bg:#fef8f0;
  --red:#ba0517; --red-bg:#fef1f1; --blue-bg:#eef4ff; --radius:.35rem; --shadow:0 2px 3px rgba(0,0,0,.08); --shadow2:0 4px 12px rgba(0,0,0,.14);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',system-ui,Arial,sans-serif;background:var(--page);color:var(--ink);font-size:14px}
h1,h2,h3{margin:0}
button{font-family:inherit;cursor:pointer}
a,.link{color:var(--brand);text-decoration:none;cursor:pointer}.link:hover{text-decoration:underline}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}
.btn{background:var(--brand);color:#fff;border:1px solid var(--brand);border-radius:var(--radius);padding:7px 15px;font-weight:600;font-size:13px;line-height:1.4}
.btn:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.neutral{background:#fff;color:var(--brand);border-color:var(--line2)}.btn.neutral:hover{background:#f4f6f9}
.btn.block{width:100%;justify-content:center}.btn.sm{padding:4px 11px;font-size:12px}
.btn.danger{background:var(--red);border-color:var(--red)}
.center{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#eef4fb,#f3f3f3)}
.auth-card{background:#fff;border:1px solid var(--line2);border-radius:12px;padding:34px;width:100%;max-width:400px;box-shadow:var(--shadow2)}
.auth-logo{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-light));display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;margin:0 auto 14px}
.auth-card h1{font-size:20px;text-align:center;margin-bottom:4px}.auth-card p{color:var(--muted);text-align:center;margin:0 0 22px;font-size:13px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.field input,.field select,.field textarea{width:100%;padding:9px 12px;background:#fff;border:1px solid var(--line2);border-radius:var(--radius);color:var(--ink);font-size:14px;font-family:inherit}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(1,118,211,.25)}
.err{color:var(--red);font-size:13px;text-align:center;min-height:18px;margin-top:8px}
.gheader{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.gtop{display:flex;align-items:center;gap:14px;padding:9px 20px}
.applogo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-light));display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none}
.appname{font-weight:700;font-size:16px}.appname small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.gtop .spacer{flex:1}
.userchip{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2)}
.avatar{width:30px;height:30px;border-radius:50%;background:#5867e8;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.tabs{display:flex;gap:2px;padding:0 12px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;background:transparent;border:none;border-bottom:3px solid transparent;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tab:hover{background:#f4f6f9;color:var(--brand)}.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab .ti{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:12px;color:#fff}
.main{padding:18px 22px;max-width:1440px;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head .pt{display:flex;align-items:center;gap:12px}
.page-head .pt .ti{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:17px}
.page-head h2{font-size:19px}.page-head .sub{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{padding:7px 11px;background:#fff;border:1px solid var(--line2);border-radius:var(--radius);color:var(--ink);font-size:13px;min-width:150px}
.grid{display:grid;gap:14px}.kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.kpi{background:#fff;border:1px solid var(--line2);border-top:3px solid var(--brand);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:600}.kpi .v{font-size:21px;font-weight:700}
.kpi .v small{font-size:12px;font-weight:600;color:var(--muted)}
.kpi.green{border-top-color:var(--green)}.kpi.green .v{color:var(--green)}
.kpi.red{border-top-color:var(--red)}.kpi.red .v{color:var(--red)}
.kpi.amber{border-top-color:var(--amber)}.kpi.amber .v{color:var(--amber)}
.card{background:#fff;border:1px solid var(--line2);border-radius:var(--radius);margin-top:16px;box-shadow:var(--shadow);overflow:hidden}
.card .chead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .chead h3{font-size:15px;display:flex;align-items:center;gap:9px}
.card .chead .ti{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:13px}
.cnt{color:var(--muted);font-weight:600;font-size:12px}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:9px 13px;text-align:start;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.3px;background:var(--th-bg)}
tbody tr:hover{background:var(--row-hover)}
.empty{padding:34px;text-align:center;color:var(--muted)}
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:700;border:1px solid transparent}
.b-green{background:var(--green-bg);color:var(--green);border-color:#b6e6c1}
.b-amber{background:var(--amber-bg);color:var(--amber);border-color:#f6d9a8}
.b-red{background:var(--red-bg);color:var(--red);border-color:#f5b9bd}
.b-blue{background:var(--blue-bg);color:var(--brand);border-color:#bcd7fb}
.b-gray{background:#f3f2f2;color:var(--ink2);border-color:#e0dede}
.highlights{background:#fff;border:1px solid var(--line2);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px}
.hl-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hl-top .ti{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:19px}
.hl-top .t{font-size:12px;color:var(--muted)}.hl-top .n{font-size:18px;font-weight:700}
.hl-fields{display:flex;gap:26px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.hl-fields .f .l{color:var(--muted);font-size:11px;margin-bottom:2px}.hl-fields .f .v{font-weight:700;font-size:13px}
.overlay{position:fixed;inset:0;background:rgba(8,7,7,.45);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:#fff;border-radius:10px;width:100%;max-width:560px;max-height:92vh;overflow:auto;box-shadow:var(--shadow2)}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);background:var(--th-bg)}

.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-grid .full{grid-column:1/-1}
.mfoot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--th-bg)}
.toast{position:fixed;bottom:22px;inset-inline-start:22px;background:#fff;border:1px solid var(--line2);border-inline-start:4px solid var(--green);padding:12px 18px;border-radius:var(--radius);box-shadow:var(--shadow2);z-index:90;font-size:13px}
.toast.err{border-inline-start-color:var(--red)}
@media(max-width:720px){.main{padding:14px}.form-grid{grid-template-columns:1fr}.appname small{display:none}}
@media print{.gheader,.tools,.no-print{display:none!important}body{background:#fff}.card,.kpi{box-shadow:none;border-color:#ccc}}

</head>

const fdate=d=>d?new Date(d).toLocaleDateString(L==='ar'?'ar-EG':'en-GB',{year:'numeric',month:'short',day:'numeric'}):'—';
const AU=()=>L==='ar'?'م²':'m²';
const esc=s=>(s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const daysTo=due=>Math.round((new Date(due)-new Date(new Date().toDateString()))/86400000);
function monthMatch(due,ym){return !ym||(due||'').slice(0,7)===ym;}
function withinDays(due,sel){if(!sel)return true;const d=daysTo(due);if(sel==='today')return d===0;if(sel==='late')return d<0;return d>=0&&d<=Number(sel);}
function toast(m,e){const t=document.createElement('div');t.className='toast'+(e?' err':'');t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}
const statusBadge=s=>{const m={'مدفوع':'b-green','مدفوع جزئي':'b-amber','متأخر':'b-red','قادم':'b-blue','مؤجرة':'b-green','شاغرة':'b-amber','لم تُستلم':'b-gray','سارية':'b-green','منتهية':'b-gray','ملغاة':'b-red'};return `<span class="badge ${m[s]||'b-gray'}">${esc(lv(s))}</span>`;};

const tabIco=id=>TABS.find(t=>t.id===id)?.ic||'●';

const pageHead=(id,title,sub,tools='')=>`<div class="page-head"><div class="pt"><div class="ti" style="background:${tabColor(id)}">${tabIco(id)}</div><div><h2>${title}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div></div><div class="tools">${tools}</div></div>`;
const cardHead=(id,title,cnt,tools='')=>`<div class="chead"><h3><span class="ti" style="background:${tabColor(id)}">${tabIco(id)}</span>${title} ${cnt!=null?`<span class="cnt">(${cnt})</span>`:''}</h3><div class="tools">${tools}</div></div>`;
const kpi=(k,v,cls)=>`<div class="kpi ${cls||''}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
async function view(v){const {data,error}=await sb.from(v).select('*');if(error){toast(error.message,true);return[];}return data;}
function val(id){const e=document.getElementById(id);return e?e.value.trim():'';}
function num(id){const v=document.getElementById(id)?.value;return v===''||v==null?null:Number(v);}
// money inputs with thousands separators
function moneyVal(id){const v=document.getElementById(id)?.value||'';const n=Number(v.replace(/[^\d.]/g,''));return v.trim()===''?null:(isNaN(n)?null:n);}
function fmtMoneyInput(el){let d=el.value.replace(/[^\d]/g,'');el.value=d?Number(d).toLocaleString('en-US'):'';}
const moneyInput=(id,v)=>`<input id="${id}" inputmode="numeric" value="${(v!=null&&v!=='')?Number(v).toLocaleString('en-US'):''}" oninput="fmtMoneyInput(this)">`;
// auto installment numbering by due-date order, per unit
function seqMap(list){const by={};list.forEach(i=>{(by[i.unit_id]=by[i.unit_id]||[]).push(i);});const m={};Object.values(by).forEach(arr=>{arr.slice().sort((a,b)=>new Date(a.due_date)-new Date(b.due_date)).forEach((i,ix)=>m[i.id]=ix+1);});return m;}
function addMonths(d,m){const x=new Date(d);const day=x.getDate();x.setMonth(x.getMonth()+m);if(x.getDate()<day)x.setDate(0);return x;}
function buildSchedule(rec,payAmt){
  if(!rec.start_date)return [];
  const step={'شهري':1,'ربع سنوي':3,'نصف سنوي':6,'سنوي':12}[rec.frequency];
  const start=new Date(rec.start_date);
  if(rec.frequency==='مرة واحدة'||!step)return [{no:1,due_date:rec.start_date,amount:payAmt||rec.rent_total||0,paid:0}];
  const end=rec.end_date?new Date(rec.end_date):addMonths(start,12);
  const dates=[];let guard=0;let cur=new Date(start);
  while(cur<=end&&guard<600){dates.push(new Date(cur));cur=addMonths(start,step*dates.length);guard++;}
  if(!dates.length)dates.push(new Date(start));
  const per=payAmt||(rec.rent_total?Math.round(rec.rent_total/dates.length):0);
  return dates.map((d,ix)=>({no:ix+1,due_date:d.toISOString().slice(0,10),amount:per,paid:0}));
}

function downloadInstTemplate(){const rows=[['تاريخ الاستحقاق / Due (YYYY-MM-DD)','القيمة / Amount','المدفوع / Paid','رقم الشيك / Cheque no.'],['2026-11-15','99000','0','CHQ-001'],['2027-04-15','161700','0','CHQ-002']];const blob=new Blob(['﻿'+rows.map(r=>r.join(',')).join('\n')],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='installments-template.csv';a.click();}

function previewInst(){const rows=parseInstRows(document.getElementById('f_rows').value);const total=rows.reduce((s,r)=>s+r.amount,0);document.getElementById('importPrev').innerHTML=rows.length?`✓ ${rows.length} ${T('rowsN')} — ${T('totalN')} ${money(total)}`:'';}
function parseInstRows(text){
  const nd=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const out=[];
  (text||'').split(/\r?\n/).forEach(raw=>{
    const line=nd(raw).trim();if(!line)return;
    const cells=line.split(line.includes('\t')?'\t':',').map(c=>c.trim());
    const d0=parseDate(cells[0]);
    if(d0){
      const amount=Number((cells[1]||'').replace(/[^\d]/g,''))||0;
      const paid=Number((cells[2]||'').replace(/[^\d]/g,''))||0;
      const cheque=(cells[3]||'').trim()||null;
      if(!amount&&!paid)return;
      out.push({due_date:d0,amount,paid,cheque_no:cheque});
    }else{
      const di=cells.findIndex(c=>parseDate(c));if(di<0)return;const due=parseDate(cells[di]);
      let amt=0,chq='';for(let k=0;k<cells.length;k++){if(k===di)continue;const dig=cells[k].replace(/[^\d]/g,'');if(dig&&!amt)amt=Number(dig);else if(cells[k]&&!/^\d/.test(cells[k])&&!parseDate(cells[k])&&!chq)chq=cells[k];}
      if(!amt)return;out.push({due_date:due,amount:amt,paid:0,cheque_no:chq||null});
    }
  });return out;
}
function parseDate(s){s=s.trim();let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);if(m){let y=m[3];if(y.length===2)y='20'+y;return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}const d=new Date(s);return isNaN(d)?null:d.toISOString().slice(0,10);}
function parseRows(text,unitId){const nd=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));const out=[];let n=0;(text||'').split(/\r?\n/).forEach(raw=>{const line=nd(raw).trim();if(!line)return;const dm=line.match(/(\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2})|(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4})/);if(!dm)return;const due=parseDate(dm[0]);if(!due)return;const post=line.slice(dm.index+dm[0].length),pre=line.slice(0,dm.index);const amtStr=(post.replace(/[^\d]/g,'')?post:pre);const amt=Number(amtStr.replace(/[^\d]/g,''));if(!amt)return;n++;out.push({unit_id:unitId,no:n,due_date:due,amount:amt,paid:0});});return out;}

     <div class="field"><label>${T('col_no')}</label><input id="f_no" type="number" value="${p.no??''}"></div>
     <div class="field"><label>${T('col_due')} *</label><input id="f_due" type="date" value="${p.due_date??''}"></div>
     <div class="field"><label>${T('col_amount')}</label>${moneyInput('f_amt',p.amount)}</div>
     <div class="field"><label>${T('col_paid')}</label>${moneyInput('f_paid',p.paid??0)}</div>

function importRent(rentalId){

   <div class="field"><textarea id="f_rows" oninput="previewRows()" style="width:100%;min-height:160px;font-family:monospace;direction:ltr;padding:10px;border:1px solid var(--line2);border-radius:.35rem" placeholder="2026-01-01\t5000"></textarea></div>

async function markRentPaid(id,amount,mode,ref){await sb.from('rent_payments').update({paid:Number(amount),paid_date:new Date().toISOString().slice(0,10)}).eq('id',id);toast(T('saved'));mode==='U'?unitProfile(ref):rentalProfile(ref);}
async function printContract(rentalId){

/* ===================== DOCUMENTS ===================== */
function docsCard(docs,ctx){
  const add=`<button class="btn sm" onclick='docForm(${JSON.stringify(ctx)})'>⬆ ${T('upload')}</button>`;
  return `<div class="card">${cardHead('units',T('documents'),docs.length,add)}
    <div class="tbl-wrap"><table><thead><tr><th>${T('doc_name')}</th><th>${T('doc_cat')}</th><th>${T('col_due')}</th><th></th></tr></thead><tbody>
    ${docs.length?docs.map(d=>`<tr><td>${esc(d.name)||'—'}</td><td>${esc(lv(d.category))}</td><td>${fdate(d.created_at)}</td>
      <td style="text-align:end"><button class="btn neutral sm" onclick="openDoc('${d.file_path}')">${T('view')}</button> <button class="btn neutral sm" onclick="delDoc('${d.id}','${d.file_path}',${JSON.stringify(ctx).replace(/"/g,'&quot;')})">${T('del')}</button></td></tr>`).join(''):`<tr><td colspan="4" class="empty">${T('noRows')}</td></tr>`}
    </tbody></table></div></div>`;
}
function docForm(ctx){
  const cats=['عقد','هوية','إيصال','مخطط','أخرى'].map(c=>`<option value="${c}">${lv(c)}</option>`).join('');
  modal(T('upload'),`
   <div class="field"><label>${T('doc_name')}</label><input id="d_name"></div>
   <div class="field"><label>${T('doc_cat')}</label><select id="d_cat">${cats}</select></div>
   <div class="field"><label>${T('doc_file')} *</label><input type="file" id="d_file"></div>`,
   async()=>{
     const f=document.getElementById('d_file').files[0];if(!f){toast(T('required'),true);return false;}
     const ext=(f.name.split('.').pop()||'bin').toLowerCase();
     const folder=ctx.unit_id?('units/'+ctx.unit_id):('rentals/'+ctx.rental_id);
     const path=`${folder}/${Date.now()}-${Math.random().toString(36).slice(2)}.${ext}`;
     const up=await sb.storage.from('documents').upload(path,f);
     if(up.error){toast(up.error.message,true);return false;}
     const rec=Object.assign({name:val('d_name')||f.name,category:val('d_cat'),file_path:path},ctx);
     const {error}=await sb.from('documents').insert(rec);
     if(error){toast(error.message,true);return false;}toast(T('saved'));
     ctx.unit_id?unitProfile(ctx.unit_id):rentalProfile(ctx.rental_id);return true;
   });
}
async function openDoc(path){const {data,error}=await sb.storage.from('documents').createSignedUrl(path,3600);if(error){toast(error.message,true);return;}window.open(data.signedUrl,'_blank');}
async function delDoc(id,path,ctx){if(!confirm(T('confirmDel')))return;await sb.storage.from('documents').remove([path]);await sb.from('documents').delete().eq('id',id);toast(T('deleted'));ctx.unit_id?unitProfile(ctx.unit_id):rentalProfile(ctx.rental_id);}

     ${kpi(T('k_vacant'),fmt(units.filter(u=>u.occupancy==='شاغرة').length),'amber')}

   <div class="card">${cardHead('units',T('rep_unit')+' — '+(esc(u.compound)||'')+' '+(esc(u.unit_number)||''),null)}

       <tr><td class="num" style="background:var(--th-bg);font-weight:700;width:35%">${T('f_type')}</td><td>${esc(lv(u.type))}</td></tr>
       <tr><td style="background:var(--th-bg);font-weight:700">${T('f_location')}</td><td>${esc(u.location)||'—'}</td></tr>
       <tr><td style="background:var(--th-bg);font-weight:700">${T('f_area')}</td><td>${u.area?fmt(u.area)+' '+AU():'—'}${u.has_garden?' 🌿'+(u.garden_area?' '+fmt(u.garden_area)+' '+AU():''):''}</td></tr>
       <tr><td style="background:var(--th-bg);font-weight:700">${T('f_pdate')}</td><td>${fdate(u.purchase_date)}</td></tr>
       <tr><td style="background:var(--th-bg);font-weight:700">${T('f_seller')}</td><td>${esc(u.seller)||'—'}</td></tr>
     </table></div></div>
   <div class="card">${cardHead('inst',T('purchase_inst'),myInst.length)}<div class="tbl-wrap"><table><thead><tr><th>${T('col_no')}</th><th>${T('col_due')}</th><th>${T('col_cheque')}</th><th class="num">${T('col_amount')}</th><th class="num">${T('col_paid')}</th><th class="num">${T('col_remaining')}</th><th>${T('col_status')}</th></tr></thead><tbody>

   </tbody></table></div></div>
   ${activeR?`<div class="card">${cardHead('rentals',T('rental')+' — '+esc(activeR.tenant_name),null)}<div class="tbl-wrap"><table>

     </tbody></table></div></div>`:''}`;

async function exportAll(){
  const [units,inst,rentals,rentp]=await Promise.all([view('v_units'),view('v_installments'),view('v_rentals'),view('v_rent_payments')]);
  csv('units.csv',units,['compound','unit_number','type','occupancy','area','purchase_date','purchase_price','down_payment','inst_paid','inst_remaining','tenant_name']);
  csv('installments.csv',inst,['compound','unit_number','no','due_date','amount','paid','remaining','status']);
  csv('rentals.csv',rentals,['compound','unit_number','tenant_name','tenant_phone','start_date','end_date','rent_total','rent_collected','status']);
  csv('rent_payments.csv',rentp,['tenant_name','compound','unit_number','no','due_date','amount','paid','remaining','status']);
  toast(T('imported'));
}
function csv(name,rows,cols){const body=rows.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(',')).join('\n');const blob=new Blob(['﻿'+cols.join(',')+'\n'+body],{type:'text/csv;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();}

/* ===================== modal + utils ===================== */
function modal(title,body,onSave,onDelete){
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="modal"><div class="mhead"><h3>${title}</h3><button class="x">×</button></div><div class="mbody">${body}</div>
    <div class="mfoot"><button class="btn" id="mSave">${T('save')}</button><button class="btn neutral" id="mCancel">${T('cancel')}</button>
      ${onDelete?`<button class="btn danger" id="mDel" style="margin-inline-start:auto">${T('del')}</button>`:''}</div></div>`;
  document.body.appendChild(o);const close=()=>o.remove();
  o.querySelector('.x').onclick=close;o.querySelector('#mCancel').onclick=close;
  o.querySelector('#mSave').onclick=async()=>{const ok=await onSave();if(ok!==false)close();};
  if(onDelete)o.querySelector('#mDel').onclick=async()=>{if(confirm(T('confirmDel'))){await onDelete();close();}};
  o.onclick=e=>{if(e.target===o)close();};
}
async function delRec(table,id,after){const {error}=await sb.from(table).delete().eq('id',id);if(error){toast(error.message,true);return;}toast(T('deleted'));after();}
boot();
