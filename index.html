<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>متابعة الأملاك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ===== Salesforce Lightning–inspired theme (RTL) ===== */
:root{
  --brand:#0176d3; --brand-dark:#014486; --brand-light:#1b96ff;
  --page:#f3f3f3; --card:#ffffff; --header:#ffffff;
  --line:#e5e5e5; --line2:#dddbda; --row-hover:#f3f2f2; --th-bg:#fafaf9;
  --ink:#080707; --ink2:#3e3e3c; --muted:#706e6b;
  --green:#2e844a; --green-bg:#eafbec; --amber:#a86403; --amber-bg:#fef8f0;
  --red:#ba0517; --red-bg:#fef1f1; --blue-bg:#eef4ff;
  --radius:.35rem; --shadow:0 2px 3px rgba(0,0,0,.08); --shadow2:0 4px 12px rgba(0,0,0,.12);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',system-ui,Arial,sans-serif;background:var(--page);color:var(--ink);font-size:14px}
h1,h2,h3{margin:0}
button{font-family:inherit;cursor:pointer}
a,.link{color:var(--brand);text-decoration:none;cursor:pointer}
.link:hover,a:hover{text-decoration:underline}
input,select{font-family:inherit}
.hidden{display:none!important}
.num{font-variant-numeric:tabular-nums}

/* ---------- Buttons (SLDS) ---------- */
.btn{background:var(--brand);color:#fff;border:1px solid var(--brand);border-radius:var(--radius);
  padding:7px 16px;font-weight:600;font-size:13px;line-height:1.4;transition:.12s}
.btn:hover{background:var(--brand-dark);border-color:var(--brand-dark)}
.btn.neutral{background:#fff;color:var(--brand);border-color:var(--line2)}
.btn.neutral:hover{background:#f4f6f9}
.btn.block{width:100%;justify-content:center}
.btn.sm{padding:4px 11px;font-size:12px}
.btn.danger{background:var(--red);border-color:var(--red)}
.btn.danger:hover{filter:brightness(.92)}

/* ---------- Setup / Login ---------- */
.center{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(180deg,#eef4fb,#f3f3f3)}
.auth-card{background:#fff;border:1px solid var(--line2);border-radius:8px;padding:34px;width:100%;max-width:400px;box-shadow:var(--shadow2)}
.auth-logo{width:52px;height:52px;border-radius:12px;background:linear-gradient(135deg,var(--brand),var(--brand-light));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:22px;margin:0 auto 14px}
.auth-card h1{font-size:20px;text-align:center;margin-bottom:4px;color:var(--ink)}
.auth-card p{color:var(--muted);text-align:center;margin:0 0 22px;font-size:13px}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--ink2);margin-bottom:5px;font-weight:600}
.field input,.field select{width:100%;padding:9px 12px;background:#fff;border:1px solid var(--line2);border-radius:var(--radius);color:var(--ink);font-size:14px}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(1,118,211,.25)}
.err{color:var(--red);font-size:13px;text-align:center;min-height:18px;margin-top:8px}

/* ---------- Global header + tabs ---------- */
.gheader{background:var(--header);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.gtop{display:flex;align-items:center;gap:14px;padding:9px 20px}
.applogo{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-light));
  display:grid;place-items:center;color:#fff;font-weight:800;font-size:16px;flex:none}
.appname{font-weight:700;font-size:16px;color:var(--ink)}
.appname small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.gtop .spacer{flex:1}
.userchip{display:flex;align-items:center;gap:9px;font-size:13px;color:var(--ink2)}
.avatar{width:30px;height:30px;border-radius:50%;background:#5867e8;color:#fff;display:grid;place-items:center;font-weight:700;font-size:13px}
.tabs{display:flex;gap:2px;padding:0 14px;overflow-x:auto}
.tab{display:flex;align-items:center;gap:8px;background:transparent;border:none;border-bottom:3px solid transparent;
  padding:11px 14px;font-size:13.5px;font-weight:600;color:var(--ink2);white-space:nowrap}
.tab:hover{background:#f4f6f9;color:var(--brand)}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab .ti{width:22px;height:22px;border-radius:5px;display:grid;place-items:center;font-size:12px;color:#fff;flex:none}

/* ---------- Page body ---------- */
.main{padding:18px 22px;max-width:1400px;margin:0 auto}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.page-head .pt{display:flex;align-items:center;gap:12px}
.page-head .pt .ti{width:36px;height:36px;border-radius:8px;display:grid;place-items:center;color:#fff;font-size:17px}
.page-head h2{font-size:19px;color:var(--ink)}
.page-head .sub{font-size:12px;color:var(--muted)}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{padding:7px 12px;background:#fff;border:1px solid var(--line2);border-radius:var(--radius);color:var(--ink);font-size:13px;min-width:190px}
.search:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 2px rgba(1,118,211,.2)}

/* ---------- KPI tiles ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(200px,1fr))}
.kpi{background:#fff;border:1px solid var(--line2);border-top:3px solid var(--brand);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow)}
.kpi .k{font-size:12px;color:var(--muted);margin-bottom:7px;font-weight:600}
.kpi .v{font-size:22px;font-weight:700;color:var(--ink);letter-spacing:.2px}
.kpi .v small{font-size:12px;font-weight:600;color:var(--muted)}
.kpi.green{border-top-color:var(--green)} .kpi.green .v{color:var(--green)}
.kpi.red{border-top-color:var(--red)} .kpi.red .v{color:var(--red)}
.kpi.amber{border-top-color:var(--amber)} .kpi.amber .v{color:var(--amber)}

/* ---------- Card / list panel ---------- */
.card{background:#fff;border:1px solid var(--line2);border-radius:var(--radius);margin-top:16px;box-shadow:var(--shadow);overflow:hidden}
.card .chead{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card .chead h3{font-size:15px;color:var(--ink);display:flex;align-items:center;gap:9px}
.card .chead .ti{width:26px;height:26px;border-radius:6px;display:grid;place-items:center;color:#fff;font-size:13px}
.cnt{color:var(--muted);font-weight:600;font-size:12px}

/* ---------- Tables (SLDS) ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px;white-space:nowrap}
th,td{padding:9px 14px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:.4px;background:var(--th-bg);position:sticky;top:0}
tbody tr:hover{background:var(--row-hover)}
.empty{padding:40px;text-align:center;color:var(--muted)}

/* ---------- Badges (SLDS status) ---------- */
.badge{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11.5px;font-weight:700;border:1px solid transparent}
.b-green{background:var(--green-bg);color:var(--green);border-color:#b6e6c1}
.b-amber{background:var(--amber-bg);color:var(--amber);border-color:#f6d9a8}
.b-red{background:var(--red-bg);color:var(--red);border-color:#f5b9bd}
.b-blue{background:var(--blue-bg);color:var(--brand);border-color:#bcd7fb}
.b-gray{background:#f3f2f2;color:var(--ink2);border-color:#e0dede}

/* ---------- Highlights panel (record home) ---------- */
.highlights{background:#fff;border:1px solid var(--line2);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 18px;margin-bottom:4px}
.hl-top{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.hl-top .ti{width:40px;height:40px;border-radius:9px;display:grid;place-items:center;color:#fff;font-size:19px}
.hl-top .t{font-size:12px;color:var(--muted)}
.hl-top .n{font-size:18px;font-weight:700;color:var(--ink)}
.hl-fields{display:flex;gap:30px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:12px}
.hl-fields .f{font-size:13px}
.hl-fields .f .l{color:var(--muted);font-size:11px;margin-bottom:2px}
.hl-fields .f .v{font-weight:700;color:var(--ink)}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(8,7,7,.45);display:grid;place-items:center;padding:16px;z-index:60}
.modal{background:#fff;border-radius:8px;width:100%;max-width:540px;max-height:92vh;overflow:auto;box-shadow:var(--shadow2)}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;padding:15px 20px;border-bottom:1px solid var(--line);background:var(--th-bg);border-radius:8px 8px 0 0}
.modal .mhead h3{font-size:16px;color:var(--ink)}
.modal .mbody{padding:20px}
.modal .x{background:none;border:none;color:var(--muted);font-size:22px;line-height:1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
.mfoot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid var(--line);background:var(--th-bg);border-radius:0 0 8px 8px}

.toast{position:fixed;bottom:22px;left:22px;background:#fff;border:1px solid var(--line2);border-right:4px solid var(--green);
  padding:12px 18px;border-radius:var(--radius);box-shadow:var(--shadow2);z-index:90;font-size:13px;color:var(--ink)}
.toast.err{border-right-color:var(--red)}

@media(max-width:720px){
  .main{padding:14px}
  .form-grid{grid-template-columns:1fr}
  .appname small{display:none}
}
@media print{
  .gheader,.tools,.no-print{display:none!important}
  body{background:#fff} .card,.kpi{box-shadow:none;border-color:#ccc}
}
</style>
</head>
<body>

<!-- ===== SETUP (only if not configured) ===== -->
<div id="setup" class="center hidden">
  <div class="auth-card">
    <div class="auth-logo">أ</div>
    <h1>ربط قاعدة البيانات</h1>
    <p>أدخل رابط Supabase والمفتاح العام</p>
    <div class="field"><label>Project URL</label><input id="cfgUrl" placeholder="https://xxxx.supabase.co"></div>
    <div class="field"><label>Publishable / anon key</label><input id="cfgKey" placeholder="sb_publishable_..."></div>
    <button class="btn block" onclick="saveCfg()">حفظ واتصال</button>
    <div class="err" id="cfgErr"></div>
  </div>
</div>

<!-- ===== LOGIN ===== -->
<div id="login" class="center hidden">
  <form class="auth-card" onsubmit="doLogin(event)">
    <div class="auth-logo">أ</div>
    <h1>متابعة الأملاك</h1>
    <p>تسجيل دخول الموظفين</p>
    <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required></div>
    <div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div>
    <button class="btn block" type="submit">تسجيل الدخول</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- ===== APP ===== -->
<div id="app" class="hidden">
  <header class="gheader">
    <div class="gtop">
      <div class="applogo">أ</div>
      <div class="appname">متابعة الأملاك<small>م. أشرف عصمت</small></div>
      <div class="spacer"></div>
      <div class="userchip"><span id="who"></span><div class="avatar" id="avatar">؟</div>
        <button class="btn neutral sm" onclick="logout()">خروج</button></div>
    </div>
    <nav class="tabs" id="tabs"></nav>
  </header>
  <main class="main"><div id="view"></div></main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================ CONFIG */
const BAKED = { url: "https://wextfkewnnykljriqfsy.supabase.co", key: "sb_publishable_aZ10ul4aedqXxSpTFfiIlw_jcffQ7rq" };
let sb=null, CFG=null, ME=null;
function getCfg(){
  if(BAKED.url && !BAKED.url.startsWith("__")) return {url:BAKED.url,key:BAKED.key};
  try{const s=localStorage.getItem('amlak_cfg');if(s)return JSON.parse(s);}catch(e){}
  return null;
}
function saveCfg(){
  const url=document.getElementById('cfgUrl').value.trim(),key=document.getElementById('cfgKey').value.trim();
  if(!url||!key){document.getElementById('cfgErr').textContent='من فضلك أدخل الرابط والمفتاح';return;}
  try{localStorage.setItem('amlak_cfg',JSON.stringify({url,key}));}catch(e){}
  location.reload();
}

/* ---------- helpers ---------- */
const fmt = n => (n==null||n==='')?'—':Number(n).toLocaleString('ar-EG',{maximumFractionDigits:0});
const money = n => fmt(n)+' ج.م';
const fdate = d => d? new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'}) : '—';
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function toast(msg,isErr){const t=document.createElement('div');t.className='toast'+(isErr?' err':'');t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),2800);}

/* ============================================================ boot/auth */
async function boot(){
  CFG=getCfg();
  if(!CFG){document.getElementById('setup').classList.remove('hidden');return;}
  sb=supabase.createClient(CFG.url,CFG.key);
  const {data:{session}}=await sb.auth.getSession();
  if(session){ME=session.user;showApp();}else{showLogin();}
  sb.auth.onAuthStateChange((_e,s)=>{if(!s)showLogin();});
}
function showLogin(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');}
async function doLogin(e){
  e.preventDefault();
  const email=document.getElementById('email').value,password=document.getElementById('password').value;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){document.getElementById('loginErr').textContent='بيانات الدخول غير صحيحة';return;}
  ME=data.user;document.getElementById('login').classList.add('hidden');showApp();
}
async function logout(){await sb.auth.signOut();location.reload();}

/* ---------- tabs / navigation ---------- */
const TABS=[
  {id:'dash',   name:'لوحة التحكم', ico:'📊', c:'#5867e8'},
  {id:'units',  name:'الوحدات',     ico:'🏢', c:'#0176d3'},
  {id:'clients',name:'العملاء',     ico:'👥', c:'#04844b'},
  {id:'inst',   name:'الأقساط',     ico:'💳', c:'#9050e9'},
  {id:'chk',    name:'الشيكات',     ico:'🧾', c:'#ff9a3c'},
  {id:'reports',name:'التقارير',    ico:'📈', c:'#c23934'},
];
const tabColor=id=>TABS.find(t=>t.id===id)?.c||'#0176d3';
const tabIco =id=>TABS.find(t=>t.id===id)?.ico||'●';
let CUR='dash';
function showApp(){
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').textContent=ME?.email||'';
  document.getElementById('avatar').textContent=(ME?.email||'؟').trim().charAt(0).toUpperCase();
  const tabs=document.getElementById('tabs');tabs.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');b.className='tab';b.dataset.id=t.id;
    b.innerHTML=`<span class="ti" style="background:${t.c}">${t.ico}</span>${t.name}`;
    b.onclick=()=>go(t.id);tabs.appendChild(b);
  });
  go('dash');
}
function go(id){
  CUR=id;
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  ({dash:viewDash,units:viewUnits,clients:viewClients,inst:viewInst,chk:viewChk,reports:viewReports}[id])();
}
const pageHead=(id,title,sub,tools='')=>`<div class="page-head">
  <div class="pt"><div class="ti" style="background:${tabColor(id)}">${tabIco(id)}</div>
    <div><h2>${title}</h2>${sub?`<div class="sub">${sub}</div>`:''}</div></div>
  <div class="tools">${tools}</div></div>`;

/* ---------- data ---------- */
async function q(table){const {data,error}=await sb.from(table).select('*');if(error){toast(error.message,true);return[];}return data;}
async function view(v){const {data,error}=await sb.from(v).select('*');if(error){toast(error.message,true);return[];}return data;}
const statusBadge = s => {
  const m={'مدفوع':'b-green','مدفوع جزئي':'b-amber','متأخر':'b-red','قادم':'b-blue',
           'تم التحصيل':'b-green','مستحق اليوم':'b-amber','مرتجع':'b-gray','ملغي':'b-gray'};
  return `<span class="badge ${m[s]||'b-gray'}">${esc(s)}</span>`;
};
const kpi=(k,v,cls)=>`<div class="kpi ${cls||''}"><div class="k">${k}</div><div class="v">${v}</div></div>`;
const cardHead=(id,title,cnt,tools='')=>`<div class="chead"><h3><span class="ti" style="background:${tabColor(id)}">${tabIco(id)}</span>${title} ${cnt!=null?`<span class="cnt">(${cnt})</span>`:''}</h3><div class="tools">${tools}</div></div>`;

/* ============================================================ DASHBOARD */
async function viewDash(){
  const V=document.getElementById('view');
  V.innerHTML=pageHead('dash','لوحة التحكم','نظرة عامة على المحفظة')+`<div id="dk"></div>`;
  const d=(await view('v_dashboard'))[0]||{};
  const chk=await view('v_cheques'),inst=await view('v_installments');
  const upcoming=chk.filter(c=>c.status!=='تم التحصيل'&&c.days_remaining>=0).sort((a,b)=>a.days_remaining-b.days_remaining).slice(0,10);
  const lateInst=inst.filter(i=>i.status==='متأخر').sort((a,b)=>b.days_late-a.days_late);
  document.getElementById('dk').innerHTML=`
   <div class="grid kpis">
    ${kpi('عدد الوحدات',fmt(d.units_count))}
    ${kpi('إجمالي العقود',money(d.total_contracts))}
    ${kpi('إجمالي المحصّل',money(d.total_collected),'green')}
    ${kpi('إجمالي المتبقي',money(d.total_remaining),'amber')}
    ${kpi('أقساط متأخرة',fmt(d.inst_late)+' <small>('+money(d.inst_late_val)+')</small>','red')}
    ${kpi('شيكات متأخرة',fmt(d.chk_late)+' <small>('+money(d.chk_late_val)+')</small>','red')}
    ${kpi('شيكات خلال ٧ أيام',fmt(d.chk_7d)+' <small>('+money(d.chk_7d_val)+')</small>','amber')}
    ${kpi('شيكات خلال ٣٠ يوم',fmt(d.chk_30d)+' <small>('+money(d.chk_30d_val)+')</small>')}
   </div>
   <div class="card">${cardHead('chk','أقرب الشيكات استحقاقًا',upcoming.length)}
     <div class="tbl-wrap"><table><thead><tr>
       <th>رقم الشيك</th><th>العميل</th><th>الوحدة</th><th>الاستحقاق</th><th class="num">القيمة</th><th>المتبقي للاستحقاق</th><th>الحالة</th></tr></thead><tbody>
     ${upcoming.length?upcoming.map(c=>`<tr><td>${esc(c.cheque_no)}</td><td>${esc(c.client_name)}</td><td>${esc(c.unit_code)}</td>
        <td>${fdate(c.due_date)}</td><td class="num">${money(c.amount)}</td><td>${esc(c.countdown)}</td><td>${statusBadge(c.status)}</td></tr>`).join(''):`<tr><td colspan="7" class="empty">لا توجد شيكات قادمة</td></tr>`}
     </tbody></table></div></div>
   <div class="card">${cardHead('inst','أقساط متأخرة',lateInst.length)}
     <div class="tbl-wrap"><table><thead><tr>
       <th>العميل</th><th>الوحدة</th><th>القسط</th><th>الاستحقاق</th><th class="num">المتبقي</th><th>أيام التأخير</th></tr></thead><tbody>
     ${lateInst.length?lateInst.map(i=>`<tr><td>${esc(i.client_name)}</td><td>${esc(i.unit_code)}</td><td>#${esc(i.no)}</td>
        <td>${fdate(i.due_date)}</td><td class="num">${money(i.remaining)}</td><td><span class="badge b-red">${fmt(i.days_late)} يوم</span></td></tr>`).join(''):`<tr><td colspan="6" class="empty">لا توجد أقساط متأخرة 🎉</td></tr>`}
     </tbody></table></div></div>`;
}

/* ============================================================ UNITS */
let _units=[],_clients=[];
async function viewUnits(){
  const V=document.getElementById('view');
  V.innerHTML=pageHead('units','الوحدات','','<input class="search" id="uSearch" placeholder="بحث..." oninput="renderUnits()"><button class="btn" onclick="unitForm()">جديد</button>')+
    `<div class="card">${cardHead('units','كل الوحدات',null)}<div class="tbl-wrap" id="uTbl"></div></div>`;
  _units=await view('v_units');_clients=await q('clients');renderUnits();
}
function renderUnits(){
  const term=(document.getElementById('uSearch')?.value||'').trim();
  let rows=_units;
  if(term)rows=rows.filter(u=>[u.code,u.client_name,u.project,u.unit_no].some(x=>(x||'').includes(term)));
  document.querySelector('#uTbl').closest('.card').querySelector('.cnt')?.remove();
  document.getElementById('uTbl').innerHTML=`<table><thead><tr>

function importInst(unitId){
  modal('استيراد جدول الأقساط',`
   <p style="margin-top:0;color:var(--muted);font-size:13px;line-height:1.7">
     الصق الجدول من Excel، أو اختر ملف CSV. كل سطر = <b>تاريخ الاستحقاق</b> ثم <b>القيمة</b>.<br>
     تُقبل التواريخ مثل 2026-11-15 أو 15/11/2026، وكل قسط ممكن يكون بقيمة مختلفة.</p>
   <div class="field"><label>اختيار ملف CSV / Excel (اختياري)</label><input type="file" id="f_file" accept=".csv,.txt,.tsv" onchange="fillFromFile()"></div>
   <div class="field"><label>الأقساط</label>
     <textarea id="f_rows" oninput="previewRows('${unitId}')" placeholder="2026-11-15\t99000
2027-04-15\t161700
2027-11-15\t99000" style="width:100%;min-height:170px;padding:10px;border:1px solid var(--line2);border-radius:.35rem;font-family:monospace;direction:ltr;font-size:13px"></textarea></div>
   <div id="importPrev" style="font-size:13px;color:var(--muted);min-height:20px"></div>
  `,async()=>{
     const rows=parseRows(document.getElementById('f_rows').value, unitId);
     if(!rows.length){toast('لا توجد صفوف صحيحة',true);return false;}
     const {error}=await sb.from('installments').insert(rows);
     if(error){toast(error.message,true);return false;}
     toast('تم استيراد '+rows.length+' قسط');(CUR==='units'?unitProfile(unitId):viewInst());return true;
  });
}
function fillFromFile(){
  const f=document.getElementById('f_file').files[0];if(!f)return;
  const r=new FileReader();r.onload=()=>{document.getElementById('f_rows').value=r.result;previewRows();};r.readAsText(f);
}
function previewRows(){
  const rows=parseRows(document.getElementById('f_rows').value,'x');
  const total=rows.reduce((s,r)=>s+r.amount,0);
  document.getElementById('importPrev').innerHTML=rows.length?`✓ ${rows.length} قسط — إجمالي ${fmt(total)} ج.م`:'';
}
function parseDate(s){
  s=s.trim();
  let m=s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
  if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[-\/.](\d{1,2})[-\/.](\d{2,4})$/);
  if(m){let y=m[3];if(y.length===2)y='20'+y;return `${y}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;}
  const d=new Date(s);return isNaN(d)?null:d.toISOString().slice(0,10);
}
function parseRows(text,unitId){
  const nd=s=>s.replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
  const out=[];let n=0;
  (text||'').split(/\r?\n/).forEach(raw=>{
    const line=nd(raw).trim();if(!line)return;
    const dm=line.match(/(\d{4}[-\/.]\d{1,2}[-\/.]\d{1,2})|(\d{1,2}[-\/.]\d{1,2}[-\/.]\d{2,4})/);
    if(!dm)return;
    const due=parseDate(dm[0]);if(!due)return;
    const post=line.slice(dm.index+dm[0].length), pre=line.slice(0,dm.index);
    const amtStr=(post.replace(/[^\d]/g,'')?post:pre);
    const amt=Number(amtStr.replace(/[^\d]/g,''));
    if(!amt)return;
    n++;out.push({unit_id:unitId,no:n,due_date:due,amount:amt,paid:0});
  });
  return out;
}

     <div class="field"><label>الحالة</label><select id="f_status">${['قادم','مستحق اليوم','تم التحصيل','مرتجع','ملغي'].map(s=>`<option ${c.status===s?'selected':''}>${s}</option>`).join('')}</select></div>
     <div class="field full"><label>ملاحظات</label><input id="f_notes" value="${esc(c.notes)}"></div>
   </div>`,async()=>{
     const rec={unit_id:val('f_unit'),cheque_no:val('f_no'),bank:val('f_bank'),received_date:val('f_rec')||null,
       due_date:val('f_due'),amount:num('f_amt')||0,status:val('f_status'),notes:val('f_notes')};
     if(!rec.unit_id||!rec.due_date){toast('الوحدة وتاريخ الاستحقاق مطلوبان',true);return false;}
     const {error}=id?await sb.from('cheques').update(rec).eq('id',id):await sb.from('cheques').insert(rec);
     if(error){toast(error.message,true);return false;}
     toast('تم الحفظ');(CUR==='units'?unitProfile(rec.unit_id):viewChk());return true;
   }, id?()=>delRec('cheques',id,viewChk):null);
}

/* ============================================================ REPORTS */
async function viewReports(){
  const d=(await view('v_dashboard'))[0]||{};
  document.getElementById('view').innerHTML=pageHead('reports','التقارير','',
    '<button class="btn neutral" onclick="window.print()">🖨️ طباعة</button><button class="btn" onclick="exportAll()">⬇️ تصدير CSV</button>')+
   `<div class="grid kpis">
    ${kpi('عدد الوحدات',fmt(d.units_count))}
    ${kpi('عدد العملاء','—')}
    ${kpi('إجمالي العقود',money(d.total_contracts))}
    ${kpi('إجمالي الأقساط',money(d.total_installments))}
    ${kpi('إجمالي المحصّل',money(d.total_collected),'green')}
    ${kpi('إجمالي المتبقي',money(d.total_remaining),'amber')}
    ${kpi('قيمة الشيكات',money(d.cheques_value))}
    ${kpi('شيكات متأخرة (قيمة)',money(d.chk_late_val),'red')}
   </div>
   <div class="card">${cardHead('reports','ملخص لكل وحدة',null)}<div class="tbl-wrap" id="rTbl"></div></div>`;
  const clients=await q('clients');document.querySelectorAll('.kpi .v')[1].textContent=fmt(clients.length);
  const units=await view('v_units');
  document.getElementById('rTbl').innerHTML=`<table><thead><tr>
    <th>الكود</th><th>العميل</th><th>المشروع</th><th class="num">العقد</th><th class="num">المقدم</th>
    <th class="num">المحصّل</th><th class="num">المتبقي</th></tr></thead><tbody>
   ${units.map(u=>`<tr><td>${esc(u.code)}</td><td>${esc(u.client_name)||'—'}</td><td>${esc(u.project)||'—'}</td>
     <td class="num">${money(u.contract_value)}</td><td class="num">${money(u.down_payment)}</td>
     <td class="num">${money(u.collected)}</td><td class="num">${money(u.remaining)}</td></tr>`).join('')}
   </tbody></table>`;
}
async function exportAll(){
  const units=await view('v_units'),inst=await view('v_installments'),chk=await view('v_cheques');
  csv('units.csv',units,['code','type','project','client_name','contract_value','down_payment','collected','remaining']);
  csv('installments.csv',inst,['unit_code','client_name','no','due_date','amount','paid','remaining','status','days_late']);
  csv('cheques.csv',chk,['cheque_no','unit_code','client_name','bank','due_date','amount','status','days_remaining']);
  toast('تم تصدير 3 ملفات');
}
function csv(name,rows,cols){
  const body=rows.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['﻿'+cols.join(',')+'\n'+body],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}

/* ============================================================ modal + utils */
function val(id){return document.getElementById(id).value.trim();}
function num(id){const v=document.getElementById(id).value;return v===''?null:Number(v);}
function modal(title,body,onSave,onDelete){
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="modal"><div class="mhead"><h3>${title}</h3><button class="x">×</button></div>
    <div class="mbody">${body}</div>
    <div class="mfoot"><button class="btn" id="mSave">حفظ</button><button class="btn neutral" id="mCancel">إلغاء</button>
      ${onDelete?'<button class="btn danger" id="mDel" style="margin-inline-start:auto">حذف</button>':''}</div></div>`;
  document.body.appendChild(o);
  const close=()=>o.remove();
  o.querySelector('.x').onclick=close;o.querySelector('#mCancel').onclick=close;
  o.querySelector('#mSave').onclick=async()=>{const ok=await onSave();if(ok!==false)close();};
  if(onDelete)o.querySelector('#mDel').onclick=async()=>{if(confirm('تأكيد الحذف؟')){await onDelete();close();}};
  o.onclick=e=>{if(e.target===o)close();};
}
async function delRec(table,id,after){
  const {error}=await sb.from(table).delete().eq('id',id);
  if(error){toast(error.message,true);return;}
  toast('تم الحذف');after();
}
boot();
</script>
