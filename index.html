<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نظام متابعة الأملاك</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f1420; --surface:#1a2130; --surface2:#222b3d; --line:#2d384d;
  --text:#eaf0f7; --muted:#93a1b7; --brand:#2f6df6; --brand2:#1e4fd0;
  --green:#22c55e; --amber:#f59e0b; --red:#ef4444; --teal:#14b8a6;
  --radius:14px; --shadow:0 6px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box}
body{margin:0;font-family:'Cairo',system-ui,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:15px}
h1,h2,h3{margin:0;font-weight:800}
button{font-family:inherit;cursor:pointer}
a{color:var(--brand)}
input,select{font-family:inherit}
.hidden{display:none!important}

/* ---------- Login ---------- */
#login{min-height:100vh;display:grid;place-items:center;padding:20px}
.login-card{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:34px;width:100%;max-width:380px;box-shadow:var(--shadow)}
.login-card h1{font-size:22px;text-align:center;margin-bottom:6px}
.login-card p{color:var(--muted);text-align:center;margin:0 0 22px;font-size:13px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 13px;background:var(--surface2);border:1px solid var(--line);border-radius:10px;color:var(--text);font-size:15px}
.field input:focus,.field select:focus{outline:none;border-color:var(--brand)}
.btn{background:var(--brand);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-weight:700;font-size:15px;transition:.15s}
.btn:hover{background:var(--brand2)}
.btn.block{width:100%}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.ghost:hover{background:var(--surface2)}
.btn.sm{padding:6px 12px;font-size:13px;border-radius:8px}
.btn.danger{background:var(--red)}
.err{color:var(--red);font-size:13px;text-align:center;min-height:18px;margin-top:6px}

/* ---------- App shell ---------- */
#app{display:flex;min-height:100vh}
.sidebar{width:230px;background:var(--surface);border-left:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:6px 10px 18px}
.brand .logo{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--brand),var(--teal));display:grid;place-items:center;font-weight:800;color:#fff}
.brand b{font-size:15px}
.nav{display:flex;flex-direction:column;gap:3px;flex:1}
.nav button{display:flex;align-items:center;gap:11px;background:transparent;border:none;color:var(--muted);padding:11px 13px;border-radius:10px;font-size:14.5px;font-weight:600;text-align:right;width:100%}
.nav button:hover{background:var(--surface2);color:var(--text)}
.nav button.active{background:var(--brand);color:#fff}
.nav .ico{width:20px;text-align:center}
.sidebar .foot{border-top:1px solid var(--line);padding-top:12px;font-size:12px;color:var(--muted)}
.main{flex:1;padding:22px 26px;overflow-x:hidden;min-width:0}
.topbar{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;gap:12px;flex-wrap:wrap}
.topbar h2{font-size:22px}
.mobile-nav{display:none}

/* ---------- Cards / KPIs ---------- */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fill,minmax(190px,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px}
.kpi .k{font-size:13px;color:var(--muted);margin-bottom:8px}
.kpi .v{font-size:23px;font-weight:800;letter-spacing:.3px}
.kpi .v small{font-size:13px;font-weight:600;color:var(--muted)}
.kpi.brand{background:linear-gradient(135deg,#1d3a7a,#20305a);border-color:#2b4a9a}
.kpi.green .v{color:var(--green)} .kpi.red .v{color:var(--red)} .kpi.amber .v{color:var(--amber)}

.section{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);margin-top:18px;overflow:hidden}
.section .head{display:flex;align-items:center;justify-content:space-between;padding:15px 18px;border-bottom:1px solid var(--line);gap:10px;flex-wrap:wrap}
.section .head h3{font-size:16px}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{padding:8px 12px;background:var(--surface2);border:1px solid var(--line);border-radius:9px;color:var(--text);font-size:14px;min-width:170px}

/* ---------- Tables ---------- */
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;white-space:nowrap}
th,td{padding:11px 14px;text-align:right;border-bottom:1px solid var(--line)}
th{color:var(--muted);font-weight:700;font-size:12.5px;position:sticky;top:0;background:var(--surface)}
tbody tr:hover{background:var(--surface2)}
td.num,th.num{font-variant-numeric:tabular-nums}
.empty{padding:34px;text-align:center;color:var(--muted)}

.badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:12px;font-weight:700}
.b-green{background:rgba(34,197,94,.15);color:#4ade80}
.b-amber{background:rgba(245,158,11,.15);color:#fbbf24}
.b-red{background:rgba(239,68,68,.15);color:#f87171}
.b-blue{background:rgba(47,109,246,.15);color:#7aa5ff}
.b-gray{background:rgba(147,161,183,.15);color:#b6c2d6}
.link{color:#7aa5ff;cursor:pointer;font-weight:700}
.link:hover{text-decoration:underline}

/* ---------- Modal ---------- */
.overlay{position:fixed;inset:0;background:rgba(6,10,18,.66);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;width:100%;max-width:520px;max-height:90vh;overflow:auto;box-shadow:var(--shadow)}
.modal .mhead{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.modal .mhead h3{font-size:17px}
.modal .mbody{padding:20px}
.modal .x{background:none;border:none;color:var(--muted);font-size:22px;line-height:1}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}
.form-grid .full{grid-column:1/-1}
.mfoot{display:flex;justify-content:flex-start;gap:10px;padding:16px 20px;border-top:1px solid var(--line)}

/* profile */
.pf-head{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:flex-start}
.pf-meta{display:flex;gap:26px;flex-wrap:wrap;margin-top:10px;color:var(--muted);font-size:14px}
.pf-meta b{color:var(--text)}

.toast{position:fixed;bottom:22px;left:22px;background:var(--surface2);border:1px solid var(--line);border-right:4px solid var(--green);padding:13px 18px;border-radius:10px;box-shadow:var(--shadow);z-index:80;font-size:14px}
.toast.err{border-right-color:var(--red)}

@media(max-width:860px){
  .sidebar{display:none}
  .mobile-nav{display:flex;overflow-x:auto;gap:6px;background:var(--surface);padding:10px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .mobile-nav button{white-space:nowrap;background:transparent;border:1px solid var(--line);color:var(--muted);padding:8px 13px;border-radius:20px;font-size:13px;font-weight:600}
  .mobile-nav button.active{background:var(--brand);color:#fff;border-color:var(--brand)}
  .main{padding:16px}
  .form-grid{grid-template-columns:1fr}
}
@media print{
  .sidebar,.mobile-nav,.tools,.nav,.no-print{display:none!important}
  body{background:#fff;color:#000} .section,.kpi{border-color:#ccc;background:#fff}
  th{background:#fff;color:#000}
}
</style>
</head>
<body>

<!-- ============ SETUP BANNER (shown until configured) ============ -->
<div id="setup" class="overlay hidden">
  <div class="modal" style="max-width:560px">
    <div class="mhead"><h3>ربط قاعدة البيانات</h3></div>
    <div class="mbody">
      <p style="color:var(--muted);margin-top:0">أدخل رابط مشروع Supabase والمفتاح العام (Publishable / anon key). تجدهما في: Supabase → Project Settings → API.</p>
      <div class="field"><label>Project URL</label><input id="cfgUrl" placeholder="https://xxxx.supabase.co"></div>
      <div class="field"><label>Publishable / anon key</label><input id="cfgKey" placeholder="sb_publishable_... أو eyJ..."></div>
      <div class="err" id="cfgErr"></div>
    </div>
    <div class="mfoot"><button class="btn" onclick="saveCfg()">حفظ واتصال</button></div>
  </div>
</div>

<!-- ============ LOGIN ============ -->
<div id="login" class="hidden">
  <form class="login-card" onsubmit="doLogin(event)">
    <div class="brand" style="justify-content:center"><div class="logo">أ</div></div>
    <h1>نظام متابعة الأملاك</h1>
    <p>تسجيل دخول الموظفين</p>
    <div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" required></div>
    <div class="field"><label>كلمة المرور</label><input id="password" type="password" required></div>
    <button class="btn block" type="submit">دخول</button>
    <div class="err" id="loginErr"></div>
  </form>
</div>

<!-- ============ APP ============ -->
<div id="app" class="hidden">
  <aside class="sidebar">
    <div class="brand"><div class="logo">أ</div><b>متابعة الأملاك</b></div>
    <nav class="nav" id="nav"></nav>
    <div class="foot">
      <div id="who" style="margin-bottom:8px"></div>
      <button class="btn ghost sm block" onclick="logout()">تسجيل الخروج</button>
    </div>
  </aside>
  <div class="main">
    <div class="mobile-nav" id="mnav"></div>
    <div id="view"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
/* ============================================================
   CONFIG — filled automatically if baked; else asks on screen
   ============================================================ */
const BAKED = { url: "https://wextfkewnnykljriqfsy.supabase.co", key: "sb_publishable_aZ10ul4aedqXxSpTFfiIlw_jcffQ7rq" };

let sb=null, CFG=null, ME=null;

function getCfg(){
  if(BAKED.url && !BAKED.url.startsWith("__")) return {url:BAKED.url,key:BAKED.key};
  try{const s=localStorage.getItem('amlak_cfg');if(s)return JSON.parse(s);}catch(e){}
  return null;
}
function saveCfg(){
  const url=document.getElementById('cfgUrl').value.trim();
  const key=document.getElementById('cfgKey').value.trim();
  if(!url||!key){document.getElementById('cfgErr').textContent='من فضلك أدخل الرابط والمفتاح';return;}
  try{localStorage.setItem('amlak_cfg',JSON.stringify({url,key}));}catch(e){}
  location.reload();
}

/* ---------- number / date helpers ---------- */
const fmt = n => (n==null||n==='')?'—':Number(n).toLocaleString('ar-EG',{maximumFractionDigits:0});
const money = n => fmt(n)+' ج.م';
const fdate = d => d? new Date(d).toLocaleDateString('ar-EG',{year:'numeric',month:'short',day:'numeric'}) : '—';
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function toast(msg,isErr){
  const t=document.createElement('div');t.className='toast'+(isErr?' err':'');t.textContent=msg;
  document.body.appendChild(t);setTimeout(()=>t.remove(),2800);
}

/* ============================================================ */
async function boot(){
  CFG=getCfg();
  if(!CFG){document.getElementById('setup').classList.remove('hidden');return;}
  sb=supabase.createClient(CFG.url,CFG.key);
  const {data:{session}}=await sb.auth.getSession();
  if(session){ ME=session.user; showApp(); } else { showLogin(); }
  sb.auth.onAuthStateChange((_e,s)=>{ if(!s){showLogin();} });
}
function showLogin(){document.getElementById('app').classList.add('hidden');document.getElementById('login').classList.remove('hidden');}
async function doLogin(e){
  e.preventDefault();
  const email=document.getElementById('email').value, password=document.getElementById('password').value;
  const {data,error}=await sb.auth.signInWithPassword({email,password});
  if(error){document.getElementById('loginErr').textContent='بيانات الدخول غير صحيحة';return;}
  ME=data.user; document.getElementById('login').classList.add('hidden'); showApp();
}
async function logout(){await sb.auth.signOut();location.reload();}

/* ---------- navigation ---------- */
const TABS=[
  {id:'dash',  name:'لوحة التحكم', ico:'📊'},
  {id:'units', name:'الوحدات',     ico:'🏢'},
  {id:'clients',name:'العملاء',    ico:'👥'},
  {id:'inst',  name:'الأقساط',     ico:'💳'},
  {id:'chk',   name:'الشيكات',     ico:'🧾'},
  {id:'reports',name:'التقارير',   ico:'📈'},
];
let CUR='dash';
function showApp(){
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('who').textContent=ME?.email||'';
  const nav=document.getElementById('nav'), mnav=document.getElementById('mnav');
  nav.innerHTML=''; mnav.innerHTML='';
  TABS.forEach(t=>{
    const b=document.createElement('button');b.innerHTML=`<span class="ico">${t.ico}</span> ${t.name}`;
    b.onclick=()=>go(t.id);b.dataset.id=t.id;nav.appendChild(b);
    const mb=document.createElement('button');mb.textContent=t.name;mb.onclick=()=>go(t.id);mb.dataset.id=t.id;mnav.appendChild(mb);
  });
  go('dash');
}
function go(id){
  CUR=id;
  document.querySelectorAll('.nav button,.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.id===id));
  ({dash:viewDash,units:viewUnits,clients:viewClients,inst:viewInst,chk:viewChk,reports:viewReports}[id])();
}

/* ---------- data helpers ---------- */
async function q(table,opts=''){const {data,error}=await sb.from(table).select('*'+ (opts?','+opts:'')); if(error){toast(error.message,true);return[];} return data;}
async function view(v){const {data,error}=await sb.from(v).select('*'); if(error){toast(error.message,true);return[];} return data;}

const statusBadge = s => {
  const m={'مدفوع':'b-green','مدفوع جزئي':'b-amber','متأخر':'b-red','قادم':'b-blue',
           'تم التحصيل':'b-green','مستحق اليوم':'b-amber','مرتجع':'b-gray','ملغي':'b-gray'};
  return `<span class="badge ${m[s]||'b-gray'}">${esc(s)}</span>`;
};

/* ============================================================
   DASHBOARD
   ============================================================ */
async function viewDash(){
  const V=document.getElementById('view');
  V.innerHTML=`<div class="topbar"><h2>لوحة التحكم</h2></div><div id="dk"></div>`;
  const rows=await view('v_dashboard'); const d=rows[0]||{};
  const chk=await view('v_cheques'); const inst=await view('v_installments');
  const upcoming=chk.filter(c=>c.status!=='تم التحصيل'&&c.days_remaining>=0).sort((a,b)=>a.days_remaining-b.days_remaining).slice(0,10);
  const lateInst=inst.filter(i=>i.status==='متأخر').sort((a,b)=>b.days_late-a.days_late);

  document.getElementById('dk').innerHTML=`
   <div class="grid kpis">
    ${kpi('عدد الوحدات',fmt(d.units_count),'brand')}
    ${kpi('إجمالي العقود',money(d.total_contracts),'')}
    ${kpi('إجمالي المحصّل',money(d.total_collected),'green')}
    ${kpi('إجمالي المتبقي',money(d.total_remaining),'amber')}
    ${kpi('أقساط متأخرة',fmt(d.inst_late)+' <small>('+money(d.inst_late_val)+')</small>','red')}
    ${kpi('شيكات متأخرة',fmt(d.chk_late)+' <small>('+money(d.chk_late_val)+')</small>','red')}
    ${kpi('شيكات خلال ٧ أيام',fmt(d.chk_7d)+' <small>('+money(d.chk_7d_val)+')</small>','amber')}
    ${kpi('شيكات خلال ٣٠ يوم',fmt(d.chk_30d)+' <small>('+money(d.chk_30d_val)+')</small>','')}
   </div>

   <div class="section">
     <div class="head"><h3>🔔 أقرب الشيكات استحقاقًا</h3></div>
     <div class="tbl-wrap"><table><thead><tr>
       <th>رقم الشيك</th><th>العميل</th><th>الوحدة</th><th>الاستحقاق</th><th class="num">القيمة</th><th>المتبقي للاستحقاق</th><th>الحالة</th>
     </tr></thead><tbody>
     ${upcoming.length?upcoming.map(c=>`<tr>
        <td>${esc(c.cheque_no)}</td><td>${esc(c.client_name)}</td><td>${esc(c.unit_code)}</td>
        <td>${fdate(c.due_date)}</td><td class="num">${money(c.amount)}</td><td>${esc(c.countdown)}</td><td>${statusBadge(c.status)}</td>
     </tr>`).join(''):`<tr><td colspan="7" class="empty">لا توجد شيكات قادمة</td></tr>`}
     </tbody></table></div>
   </div>

   <div class="section">
     <div class="head"><h3>⚠️ أقساط متأخرة</h3></div>
     <div class="tbl-wrap"><table><thead><tr>
       <th>العميل</th><th>الوحدة</th><th>القسط</th><th>الاستحقاق</th><th class="num">المتبقي</th><th>أيام التأخير</th>
     </tr></thead><tbody>
     ${lateInst.length?lateInst.map(i=>`<tr>
        <td>${esc(i.client_name)}</td><td>${esc(i.unit_code)}</td><td>#${esc(i.no)}</td>
        <td>${fdate(i.due_date)}</td><td class="num">${money(i.remaining)}</td><td><span class="badge b-red">${fmt(i.days_late)} يوم</span></td>
     </tr>`).join(''):`<tr><td colspan="6" class="empty">لا توجد أقساط متأخرة 🎉</td></tr>`}
     </tbody></table></div>
   </div>`;
}
const kpi=(k,v,cls)=>`<div class="kpi ${cls}"><div class="k">${k}</div><div class="v">${v}</div></div>`;

/* ============================================================
   UNITS
   ============================================================ */
let _units=[],_clients=[];
async function viewUnits(){
  const V=document.getElementById('view');
  V.innerHTML=`<div class="topbar"><h2>الوحدات</h2><button class="btn" onclick="unitForm()">+ إضافة وحدة</button></div>
   <div class="section"><div class="head"><h3>كل الوحدات</h3>
     <div class="tools"><input class="search" id="uSearch" placeholder="بحث بالكود / العميل / المشروع" oninput="renderUnits()"></div></div>
     <div class="tbl-wrap" id="uTbl"></div></div>`;
  _units=await view('v_units'); _clients=await q('clients');
  renderUnits();
}
function renderUnits(){
  const term=(document.getElementById('uSearch')?.value||'').trim();
  let rows=_units;
  if(term) rows=rows.filter(u=>[u.code,u.client_name,u.project,u.unit_no].some(x=>(x||'').includes(term)));
  document.getElementById('uTbl').innerHTML=`<table><thead><tr>
    <th>الكود</th><th>النوع</th><th>المشروع</th><th>العميل</th><th class="num">قيمة العقد</th>
    <th class="num">المحصّل</th><th class="num">المتبقي</th><th>أقساط</th><th></th>
   </tr></thead><tbody>
   ${rows.length?rows.map(u=>`<tr>
     <td><span class="link" onclick="unitProfile('${u.id}')">${esc(u.code)}</span></td>
     <td>${esc(u.type)}</td><td>${esc(u.project)}</td><td>${esc(u.client_name)||'—'}</td>
     <td class="num">${money(u.contract_value)}</td><td class="num">${money(u.collected)}</td>
     <td class="num">${money(u.remaining)}</td><td>${fmt(u.installments_count)}</td>
     <td><button class="btn ghost sm" onclick="unitForm('${u.id}')">تعديل</button></td>
   </tr>`).join(''):`<tr><td colspan="9" class="empty">لا توجد وحدات</td></tr>`}
   </tbody></table>`;
}
function unitForm(id){
  const u=id?_units.find(x=>x.id===id):{};
  const opts=_clients.map(c=>`<option value="${c.id}" ${u.client_id===c.id?'selected':''}>${esc(c.name)}</option>`).join('');
  modal(id?'تعديل وحدة':'إضافة وحدة',`
   <div class="form-grid">
     <div class="field"><label>كود الوحدة *</label><input id="f_code" value="${esc(u.code)}"></div>
     <div class="field"><label>النوع</label><select id="f_type">${['شقة','محل','مكتب','فيلا','أرض','أخرى'].map(t=>`<option ${u.type===t?'selected':''}>${t}</option>`).join('')}</select></div>
     <div class="field"><label>رقم الوحدة</label><input id="f_unitno" value="${esc(u.unit_no)}"></div>
     <div class="field"><label>المشروع / العنوان</label><input id="f_project" value="${esc(u.project)}"></div>
     <div class="field full"><label>العميل</label><select id="f_client"><option value="">— بدون —</option>${opts}</select></div>
     <div class="field"><label>قيمة العقد</label><input id="f_cv" type="number" value="${u.contract_value??''}"></div>
     <div class="field"><label>المقدم</label><input id="f_dp" type="number" value="${u.down_payment??''}"></div>
     <div class="field"><label>تاريخ التعاقد</label><input id="f_cd" type="date" value="${u.contract_date??''}"></div>
     <div class="field"><label>مدة التقسيط (شهور)</label><input id="f_m" type="number" value="${u.months??''}"></div>
     <div class="field full"><label>ملاحظات</label><input id="f_notes" value="${esc(u.notes)}"></div>
   </div>`,async()=>{

let _clist=[];
async function viewClients(){

function renderClients(){
  const term=(document.getElementById('cSearch')?.value||'').trim();

   ${rows.length?rows.map(c=>{
     const us=_clist.filter(u=>u.client_id===c.id);

     return `<tr><td><b>${esc(c.name)}</b></td><td>${esc(c.phone)||'—'}</td><td>${us.length}</td>

async function exportAll(){
  const units=await view('v_units'), inst=await view('v_installments'), chk=await view('v_cheques');
  csv('units.csv',units,['code','type','project','client_name','contract_value','down_payment','collected','remaining']);
  csv('installments.csv',inst,['unit_code','client_name','no','due_date','amount','paid','remaining','status','days_late']);
  csv('cheques.csv',chk,['cheque_no','unit_code','client_name','bank','due_date','amount','status','days_remaining']);
  toast('تم تصدير 3 ملفات');
}
function csv(name,rows,cols){
  const head=cols.join(',');
  const body=rows.map(r=>cols.map(c=>`"${String(r[c]??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob=new Blob(['﻿'+head+'\n'+body],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
}

/* ============================================================
   MODAL + small utils
   ============================================================ */
function val(id){return document.getElementById(id).value.trim();}
function num(id){const v=document.getElementById(id).value;return v===''?null:Number(v);}
function modal(title,body,onSave,onDelete){
  const o=document.createElement('div');o.className='overlay';
  o.innerHTML=`<div class="modal"><div class="mhead"><h3>${title}</h3><button class="x">×</button></div>
    <div class="mbody">${body}</div>
    <div class="mfoot"><button class="btn" id="mSave">حفظ</button>
      <button class="btn ghost" id="mCancel">إلغاء</button>
      ${onDelete?'<button class="btn danger" id="mDel" style="margin-inline-start:auto">حذف</button>':''}</div></div>`;
  document.body.appendChild(o);
  const close=()=>o.remove();
  o.querySelector('.x').onclick=close; o.querySelector('#mCancel').onclick=close;
  o.querySelector('#mSave').onclick=async()=>{const ok=await onSave();if(ok!==false)close();};
  if(onDelete)o.querySelector('#mDel').onclick=async()=>{if(confirm('تأكيد الحذف؟')){await onDelete();close();}};
  o.onclick=e=>{if(e.target===o)close();};
}
async function delRec(table,id,after){
  const {error}=await sb.from(table).delete().eq('id',id);
  if(error){toast(error.message,true);return;}
  toast('تم الحذف'); after();
}

boot();
